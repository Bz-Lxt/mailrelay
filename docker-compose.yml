services:
  app:
    build:
      context: .
      dockerfile: benzhi.Dockerfile
    environment:
      - TZ=Asia/Shanghai
      - MAILRELAY_DIR=/data
      - MAILRELAY_ADDR=:8080
    ports:
      - "18110:8080"
    volumes:
      - app-data:/data
    working_dir: /app
    command:
      - sh
      - -c
      - go build -o /tmp/mailrelay ./cmd/mailrelay && /tmp/mailrelay -addr :8080 -data /data -web /app/web

volumes:
  app-data:
